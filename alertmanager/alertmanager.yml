# Alertmanager — how alerts are grouped, throttled, and delivered.
route:
  # Group alerts by name + instance so ten disk alerts on one host arrive as one message.
  group_by: ['alertname', 'instance']
  group_wait: 30s          # wait a bit for related alerts before the first notification
  group_interval: 5m       # how long before sending an updated grouped notification
  repeat_interval: 4h      # re-notify about a still-firing alert at most this often
  receiver: 'discord'      # default receiver

  routes:
    # Critical alerts also go out, and could route to a different channel/receiver.
    - matchers:
        - severity = "critical"
      receiver: 'discord'
      repeat_interval: 1h    # nag more often for criticals

# Suppress warnings for a host that already has a critical firing (avoid double noise).
inhibit_rules:
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: ['instance']

receivers:
  - name: 'discord'
    webhook_configs:
      # Points at the alertmanager-discord bridge container, which reformats
      # Alertmanager's payload for a Discord webhook.
      - url: 'http://alertmanager-discord:9094'
        send_resolved: true

  # Example email receiver — fill in and switch the route's receiver to use it.

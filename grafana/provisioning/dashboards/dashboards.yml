# Tells Grafana to load dashboard JSON files from disk (dashboards-as-code).
apiVersion: 1

providers:
  - name: 'homelab-dashboards'
    orgId: 1
    folder: 'Homelab'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

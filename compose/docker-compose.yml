# Prometheus + Grafana + Alertmanager + a local node_exporter.
#   cp .env.example .env  &&  edit .env
#   docker compose up -d
# Config is mounted from the repo so the whole stack is defined in git.

# Pin the project name so this stack doesn't collide with other labs whose
# compose file also lives in a compose/ dir (Compose would name them all "compose").
name: monitoring

services:

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    networks: [monitoring]

  alertmanager:
    # v0.28+ posts to Discord natively (discord_configs), so we no longer need
    # the abandoned benjojo/alertmanager-discord :latest bridge that used to sit here.
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # The Discord webhook URL is a secret: it lives in a gitignored file
      # (alertmanager/discord.secret) mounted here, referenced by webhook_url_file.
      - ../alertmanager/discord.secret:/etc/alertmanager/discord_webhook:ro
    ports:
      - "9093:9093"
    networks: [monitoring]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - TZ=${TZ}
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [monitoring]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    # NOTE: on the bridge network the exporter's /proc/net/dev is its own network
    # namespace, so the Grafana "Network" panels reflect this container's veth, not
    # the host NICs (CPU/mem/disk/filesystem come from pid:host + /host and ARE the
    # host's). True host NIC throughput needs `network_mode: host`, but a host-net
    # container publishes no port, so Prometheus can only reach it if the host
    # firewall allows bridge->host:9100 — not portable, so we keep bridge here and
    # document the limitation. See runbook 01.
    networks: [monitoring]

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
